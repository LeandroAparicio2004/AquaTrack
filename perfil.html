<!DOCTYPE html>
<html lang="es">

<head>
  <script>
    (function () {
      if (localStorage.getItem('aquatrack_tema') === 'oscuro') {
        document.documentElement.setAttribute('data-tema', 'oscuro');
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil — AquaTrack</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/comunes.css">
  <link rel="stylesheet" href="css/menu-cliente.css">
  <link rel="stylesheet" href="css/inicio.css">
  <link rel="stylesheet" href="css/seguimiento.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/perfil.css">
</head>

<body>
  <header class="encabezado inicio-encabezado">
    <div class="contenedor encabezado-interno">
      <div class="encabezado-izquierda">
        <a href="index.html" class="marca-inicio" aria-label="Ir al inicio de AquaTrack">
          <span class="logo">AquaTrack</span>
        </a>
      </div>

      <nav class="navegacion-inicio" aria-label="Navegación principal">
        <a href="productos.html" class="enlace-nav">Productos</a>
        <div class="nav-sesion" id="nav-usuario">
          <a href="historial.html" class="enlace-nav">Mis pedidos</a>
          <a href="suscripciones.html" class="enlace-nav">Suscripciones</a>
          <a href="perfil.html" class="enlace-nav">Mi perfil</a>
          <a href="ayuda.html" class="enlace-nav">Ayuda</a>
          <button type="button" class="btn btn-secundario btn-peligro" id="boton-cerrar-sesion">Salir</button>
        </div>
        <button type="button" class="btn-tema" id="btn-tema" aria-label="Cambiar tema"></button>
      </nav>
    </div>
  </header>

  <main class="pagina-perfil">
    <div class="contenedor">
      <div class="encabezado-seguimiento">
        <p class="etiqueta-seccion">Tu cuenta</p>
        <h1>Mi perfil</h1>
      </div>

      <div class="pestanas-perfil" role="tablist">
        <button type="button" class="pestana-perfil activa" data-pestana-perfil="datos">Datos</button>
        <button type="button" class="pestana-perfil" data-pestana-perfil="direcciones">Direcciones</button>
      </div>

      <section id="panel-datos" class="panel-perfil-pestana">
      <form class="tarjeta-perfil" id="formulario-datos" novalidate>
        <h2>Datos personales</h2>

        <div class="campo-perfil">
          <label for="correo-perfil">Correo</label>
          <input type="email" id="correo-perfil" disabled>
        </div>
        <div class="campo-perfil">
          <label for="nombre-perfil">Nombre</label>
          <input type="text" id="nombre-perfil" required>
        </div>
        <div class="campo-perfil">
          <label for="apellido-perfil">Apellido</label>
          <input type="text" id="apellido-perfil" required>
        </div>
        <div class="campo-perfil">
          <label for="telefono-perfil">Teléfono</label>
          <input type="tel" id="telefono-perfil" inputmode="tel" required>
        </div>

        <p class="mensaje-perfil" id="mensaje-datos"></p>
        <button type="submit" class="btn btn-principal" id="btn-guardar-datos">Guardar cambios</button>
      </form>
      </section>

      <section id="panel-direcciones" class="panel-perfil-pestana" hidden>
        <div class="tarjeta-perfil tarjeta-ancha">
          <h2>Mis direcciones</h2>
          <div id="lista-direcciones-perfil"></div>
          <p class="mensaje-perfil" id="mensaje-lista-direcciones"></p>
        </div>

        <form class="tarjeta-perfil tarjeta-ancha" id="formulario-direccion" novalidate>
          <h2 id="titulo-formulario-direccion">Agregar dirección</h2>

          <div class="campo-perfil">
            <label for="alias-direccion">Nombre (ej: Casa, Trabajo)</label>
            <input type="text" id="alias-direccion" maxlength="30">
          </div>

          <div class="campo-perfil campo-buscador-perfil">
            <label for="buscador-perfil">Buscá tu dirección</label>
            <input type="text" id="buscador-perfil" placeholder="Ej: Piedra Blanca" autocomplete="off">
            <div id="sugerencias-perfil" class="sugerencias-perfil" hidden></div>
          </div>

          <div id="mapa-perfil" class="mapa-perfil"></div>

          <div class="fila-perfil">
            <div class="campo-perfil">
              <label for="calle-perfil">Calle</label>
              <input type="text" id="calle-perfil">
            </div>
            <div class="campo-perfil">
              <label for="numero-perfil">Número</label>
              <input type="text" id="numero-perfil">
            </div>
          </div>
          <div class="fila-perfil">
            <div class="campo-perfil">
              <label for="ciudad-perfil">Ciudad</label>
              <input type="text" id="ciudad-perfil">
            </div>
            <div class="campo-perfil">
              <label for="provincia-perfil">Provincia</label>
              <input type="text" id="provincia-perfil" value="Catamarca">
            </div>
          </div>
          <div class="campo-perfil">
            <label for="referencia-perfil">Referencia (opcional)</label>
            <input type="text" id="referencia-perfil" placeholder="Entre calles, color de casa...">
          </div>

          <input type="hidden" id="latitud-perfil">
          <input type="hidden" id="longitud-perfil">

          <p class="mensaje-perfil" id="mensaje-direccion"></p>
          <button type="submit" class="btn btn-principal" id="btn-guardar-direccion">Guardar dirección</button>
          <button type="button" class="btn btn-secundario oculto" id="btn-cancelar-edicion">Cancelar edición</button>
        </form>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/perfil.js"></script>
  <script src="js/tema.js"></script>
  <script src="js/menu-cliente.js"></script>
</body>

</html>
