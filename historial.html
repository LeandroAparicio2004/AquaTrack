<!DOCTYPE html>
<html lang="es">

<head>
  <script>
    (function () {
      if (localStorage.getItem('aquatrack_tema') === 'oscuro') {
        document.documentElement.setAttribute('data-tema', 'oscuro');
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Historial de pedidos y tickets en AquaTrack.">
  <title>Historial de tickets — AquaTrack</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/comunes.css">
  <link rel="stylesheet" href="css/inicio.css">
  <link rel="stylesheet" href="css/seguimiento.css">
  <link rel="stylesheet" href="css/historial.css">
</head>

<body>
  <header class="encabezado inicio-encabezado">
    <div class="contenedor encabezado-interno">
      <a href="index.html" class="marca-inicio" aria-label="Ir al inicio de AquaTrack">
        <span class="logo">AquaTrack</span>
      </a>

      <nav class="navegacion-inicio" aria-label="Navegación principal">
        <a href="productos.html" class="enlace-nav">Productos</a>

        <div class="nav-sesion" id="nav-invitado">
          <a href="login.html" class="enlace-nav">Iniciar sesión</a>
          <a href="registro.html" class="btn btn-secundario">Crear cuenta</a>
        </div>

        <div class="nav-sesion oculto" id="nav-usuario">
          <a href="historial.html" class="enlace-nav">Mis pedidos</a>
          <a href="suscripciones.html" class="enlace-nav">Suscripciones</a>
          <button type="button" class="btn btn-secundario btn-peligro" id="boton-cerrar-sesion">Salir</button>
        </div>

        <button type="button" class="btn-tema" id="btn-tema" aria-label="Cambiar tema"></button>
      </nav>
    </div>
  </header>

  <main class="pagina-historial">
    <div class="contenedor">

      <div class="encabezado-seguimiento">
        <p class="etiqueta-seccion">Tus pedidos</p>
        <h1>Historial de tickets</h1>
      </div>

      <div class="filtros-historial" id="filtros-historial">
        <button type="button" class="chip-filtro-historial activo" data-filtro="todos">Todos</button>
        <button type="button" class="chip-filtro-historial" data-filtro="pendiente">Pendientes</button>
        <button type="button" class="chip-filtro-historial" data-filtro="asignado">Asignados</button>
        <button type="button" class="chip-filtro-historial" data-filtro="en_camino">En camino</button>
        <button type="button" class="chip-filtro-historial" data-filtro="entregado">Entregados</button>
        <button type="button" class="chip-filtro-historial" data-filtro="cancelado">Cancelados</button>
      </div>

      <p class="estado-historial oculto" id="estado-historial"></p>

      <div class="lista-historial" id="lista-historial"></div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/historial.js"></script>
  <script src="js/tema.js"></script>
</body>

</html>
