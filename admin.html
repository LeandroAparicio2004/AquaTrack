<!DOCTYPE html>
<html lang="es">

<head>
    <script>
        (function () {
            if (localStorage.getItem('aquatrack_tema') === 'oscuro') {
                document.documentElement.setAttribute('data-tema', 'oscuro');
            }
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin — AquaTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/comunes.css">
    <link rel="stylesheet" href="css/panel-vendedor.css">
</head>

<body>

    <div class="panel-cargando" id="panel-cargando">
        <p>Cargando tu panel...</p>
    </div>

    <header class="encabezado panel-encabezado oculto" id="panel-header">
        <div class="contenedor encabezado-interno">
            <div class="panel-marca">
                <span class="logo">AquaTrack</span>
                <span class="panel-etiqueta">Panel Admin</span>
            </div>

            <nav class="panel-nav">
                <a href="metricas-admin.html" class="btn btn-secundario btn-chico">Ver métricas</a>
                <a href="chat.html" class="btn-icono-circular" aria-label="Mensajes" title="Mensajes">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                </a>
                <button type="button" class="btn-tema" id="btn-tema" aria-label="Cambiar tema"></button>
                <button type="button" class="btn btn-secundario btn-peligro" id="boton-cerrar-sesion">Salir</button>
            </nav>
        </div>
    </header>

    <main class="panel-contenido oculto" id="panel-main">
        <div class="contenedor">
            <div class="panel-encabezado-negocio">
                <p class="etiqueta-seccion">AquaTrack</p>
                <h1>Panel de Administración</h1>
            </div>

            <div class="panel-grupos dos-columnas" role="tablist">
                <button type="button" class="panel-grupo activo" data-grupo="inicio" role="tab">Inicio</button>
                <button type="button" class="panel-grupo" data-grupo="distribuidoras" role="tab">Distribuidoras <span class="insignia-urgente" id="insignia-distribuidoras" hidden></span></button>
                <button type="button" class="panel-grupo" data-grupo="dinero" role="tab">Dinero <span class="insignia-urgente" id="insignia-dinero" hidden></span></button>
                <button type="button" class="panel-grupo" data-grupo="publicidad" role="tab">Publicidad <span class="insignia-urgente" id="insignia-publicidad" hidden></span></button>
            </div>

            <div class="panel-subpestanas" data-grupo="inicio" hidden>
                <button type="button" class="panel-pestana activa" data-pestana="inicio">Inicio</button>
            </div>
            <div class="panel-subpestanas" data-grupo="distribuidoras" hidden>
                <button type="button" class="panel-pestana" data-pestana="pendientes">Por aprobar</button>
                <button type="button" class="panel-pestana" data-pestana="todas">Todas</button>
            </div>
            <div class="panel-subpestanas" data-grupo="dinero" hidden>
                <button type="button" class="panel-pestana" data-pestana="pagos">Pagos por transferencia</button>
                <button type="button" class="panel-pestana" data-pestana="movimientos">Movimientos</button>
            </div>
            <div class="panel-subpestanas" data-grupo="publicidad" hidden>
                <button type="button" class="panel-pestana" data-pestana="publicidad">Publicidad</button>
            </div>

            <section class="panel-seccion" id="seccion-inicio" role="tabpanel">
                <div class="panel-seccion-encabezado">
                    <h2>Qué hay para hacer</h2>
                </div>
                <div class="inicio-tarjetas">
                    <button type="button" class="inicio-tarjeta" data-ir="pendientes" id="inicio-tarjeta-distribuidoras">
                        <span class="inicio-numero" id="inicio-distribuidoras">–</span>
                        <span class="inicio-titulo">Distribuidoras por aprobar</span>
                        <span class="inicio-ayuda">Solicitudes nuevas</span>
                    </button>
                    <button type="button" class="inicio-tarjeta" data-ir="pagos" id="inicio-tarjeta-pagos">
                        <span class="inicio-numero" id="inicio-pagos">–</span>
                        <span class="inicio-titulo">Pagos por verificar</span>
                        <span class="inicio-ayuda">Transferencias de clientes</span>
                    </button>
                    <button type="button" class="inicio-tarjeta" data-ir="publicidad" id="inicio-tarjeta-anuncios">
                        <span class="inicio-numero" id="inicio-anuncios">–</span>
                        <span class="inicio-titulo">Anuncios por revisar</span>
                        <span class="inicio-ayuda">Publicidad pendiente</span>
                    </button>
                </div>
                <a href="metricas-admin.html" class="btn btn-secundario inicio-metricas">Ver métricas</a>
            </section>

            <section class="panel-seccion oculto" id="seccion-pendientes" role="tabpanel">
                <p class="estado-productos-panel oculto" id="estado-pendientes"></p>
                <div class="grilla-productos-panel" id="lista-pendientes"></div>
            </section>

            <section class="panel-seccion oculto" id="seccion-todas" role="tabpanel">
                <p class="estado-productos-panel oculto" id="estado-todas"></p>
                <div class="grilla-productos-panel" id="lista-todas"></div>
            </section>

            <section class="panel-seccion oculto" id="seccion-pagos" role="tabpanel">
                <div class="panel-seccion-encabezado">
                    <h2>Pagos por transferencia</h2>

                    <select id="filtro-pagos" class="filtro-pedidos" aria-label="Filtrar pagos">
                        <option value="pendientes">Por hacer</option>
                        <option value="pagados">Ya pagados</option>
                        <option value="todos">Todos</option>
                    </select>
                </div>
                <p class="estado-productos-panel oculto" id="estado-pagos"></p>
                <div class="lista-pagos-transferencia" id="lista-pagos-transferencia"></div>
            </section>

            <section class="panel-seccion oculto" id="seccion-movimientos" role="tabpanel">
                <div class="panel-seccion-encabezado">
                    <h2>Movimientos de dinero</h2>
                    <button type="button" class="btn btn-secundario" id="btn-exportar-movimientos">Descargar Excel</button>
                </div>

                <div class="filtros-movimientos">
                    <label>Desde <input type="date" id="movimientos-desde"></label>
                    <label>Hasta <input type="date" id="movimientos-hasta"></label>
                    <button type="button" class="btn btn-secundario btn-chico" id="btn-filtrar-movimientos">Filtrar</button>
                </div>

                <div class="resumen-cobros" id="resumen-movimientos"></div>

                <p class="estado-productos-panel oculto" id="estado-movimientos"></p>

                <div class="contenedor-tabla-cobros">
                    <table class="tabla-cobros">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Cliente</th>
                                <th>Distribuidora</th>
                                <th>Monto bruto</th>
                                <th>Comisión</th>
                                <th>Neto a rendir</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="lista-movimientos"></tbody>
                    </table>
                </div>
            </section>

            <section class="panel-seccion oculto" id="seccion-publicidad-admin" role="tabpanel">
                <p class="estado-productos-panel oculto" id="estado-publicidad-admin"></p>
                <div class="grilla-productos-panel" id="lista-publicidad-admin"></div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/tema.js"></script>
</body>

</html>
